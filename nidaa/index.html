<script>
  // The QR code points here. Fill in a store link when that listing is live; until then this page says "coming soon".
  // Before release, a TestFlight public link or a Play testing link can go here instead.
  var STORE = {
    ios: "",     // App Store, e.g. "https://apps.apple.com/app/id1234567890"
    android: ""  // Google Play: "https://play.google.com/store/apps/details?id=com.azanapp"
  };
  // iPads that ask for desktop sites say "Macintosh" but have a touch screen.
  var ua = navigator.userAgent;
  var platform = /android/i.test(ua) ? "android"
    : (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) ? "ios" : "";
  if (platform && STORE[platform] && !/[?&]stay\b/.test(location.search)) location.replace(STORE[platform]);
</script>

<script>
  // Shown on a computer, when a store isn't live yet, or with ?stay. The visitor's own store comes first.
  var stores = [["ios", "App Store", "iPhone"], ["android", "Google Play", "Android"]];
  if (platform === "android") stores.reverse();
  var box = document.getElementById("badges");
  stores.forEach(function (s) {
    var el = document.createElement(STORE[s[0]] ? "a" : "span");
    el.className = STORE[s[0]] ? "badge" : "badge soon";
    el.textContent = STORE[s[0]] ? s[1] + " (" + s[2] + ")" : s[1] + ": coming soon";
    if (STORE[s[0]]) el.href = STORE[s[0]];
    box.appendChild(el);
  });
  if (platform && !STORE[platform])
    document.getElementById("status").textContent = (platform === "ios" ? "The iPhone" : "The Android") +
      " app is coming soon. Please check this page again, or scan the code again after the launch.";
</script>
